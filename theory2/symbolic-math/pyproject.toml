[project]
name = "theory2-symbolic-math"
version = "0.1.0"
description = "Symbolic mathematics module (SageMath, LiE, mpmath)"
requires-python = ">=3.11"

dependencies = [
    "theory2-shared",
    "sympy>=1.12",
    "mpmath>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
